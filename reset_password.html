<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 재설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .reset-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    .reset-container h2 {
      margin-bottom: 25px;
      color: #333;
    }
    .reset-container input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .reset-container button {
      width: 100%;
      padding: 14px;
      background-color: #2575fc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .reset-container button:hover {
      background-color: #1a5ee6;
    }
    .small-text {
      font-size: 14px;
      margin-top: 15px;
      color: #666;
    }
    .small-text a {
      color: #2575fc;
      text-decoration: none;
    }
    .small-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="reset-container">
    <h2>비밀번호 재설정</h2>

    <input type="password" id="newPassword" placeholder="새 비밀번호 입력">
    <input type="password" id="confirmPassword" placeholder="새 비밀번호 확인">
    
    <button onclick="resetPassword()">비밀번호 변경</button>

    <div class="small-text">
      <a href="login.html">로그인 화면으로 돌아가기</a>
    </div>
  </div>

  <script>
    function resetPassword() {
      const newPassword = document.getElementById("newPassword").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();

      if (!newPassword || !confirmPassword) {
        alert("모든 입력칸을 채워주세요.");
        return;
      }

      if (newPassword.length < 8) {
        alert("비밀번호는 최소 8자 이상이어야 합니다.");
        return;
      }

      if (newPassword !== confirmPassword) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      // 여기서 서버로 비밀번호 변경 요청을 보낼 수 있음 (지금은 모의)
      alert("비밀번호가 성공적으로 변경되었습니다! 로그인 페이지로 이동합니다.");
      window.location.href = "login.html";
    }
  </script>

</body>
</html>
