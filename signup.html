<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .signup-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    .signup-container h2 {
      margin-bottom: 25px;
      color: #333;
    }
    .signup-container input[type="text"],
    .signup-container input[type="password"],
    .signup-container input[type="email"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .signup-container input[type="file"] {
      margin-bottom: 15px;
    }
    .password-strength {
      text-align: left;
      font-size: 13px;
      margin-bottom: 10px;
      color: #555;
    }
    .strength-weak { color: crimson; }
    .strength-medium { color: orange; }
    .strength-strong { color: green; }
    .signup-container button {
      width: 100%;
      padding: 14px;
      background-color: #2575fc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .signup-container button:hover {
      background-color: #1a5ee6;
    }
    .small-text {
      font-size: 14px;
      margin-top: 15px;
      color: #666;
    }
    .small-text a {
      color: #2575fc;
      text-decoration: none;
    }
    .small-text a:hover {
      text-decoration: underline;
    }
    .terms {
      text-align: left;
      margin-bottom: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="signup-container">
    <h2>회원가입</h2>

    <input type="text" id="username" placeholder="아이디 (6자 이상)">
    <button onclick="checkDuplicate()">아이디 중복 확인</button>

    <input type="password" id="password" placeholder="비밀번호 (8자 이상)" oninput="checkPasswordStrength()">
    <div class="password-strength" id="passwordStrength"></div>

    <input type="password" id="confirmPassword" placeholder="비밀번호 확인">
    <input type="email" id="email" placeholder="이메일 주소">
    <input type="file" id="profileImage">

    <div class="terms">
      <input type="checkbox" id="agreeTerms">
      <label for="agreeTerms">회원가입 약관에 동의합니다.</label>
    </div>

    <button onclick="signup()">회원가입 완료</button>

    <div class="small-text">
      이미 계정이 있으신가요? <a href="login.html">로그인하기</a>
    </div>
  </div>

  <script>
    let isIdChecked = false; // 아이디 중복 확인 여부

    function checkDuplicate() {
      const username = document.getElementById("username").value.trim();
      if (!username) {
        alert("아이디를 입력하세요.");
        return;
      }

      // 실제 서버 요청 없이 모의 검증 (기본 구현)
      if (username.toLowerCase() === "admin" || username.toLowerCase() === "test") {
        alert("이미 사용 중인 아이디입니다.");
        isIdChecked = false;
      } else {
        alert("사용 가능한 아이디입니다.");
        isIdChecked = true;
      }
    }

    function checkPasswordStrength() {
      const pw = document.getElementById("password").value;
      const strengthText = document.getElementById("passwordStrength");

      if (pw.length === 0) {
        strengthText.textContent = "";
        return;
      }
      if (pw.length < 6) {
        strengthText.textContent = "비밀번호 강도: 약함";
        strengthText.className = "password-strength strength-weak";
      } else if (/[A-Za-z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) {
        strengthText.textContent = "비밀번호 강도: 강함";
        strengthText.className = "password-strength strength-strong";
      } else {
        strengthText.textContent = "비밀번호 강도: 보통";
        strengthText.className = "password-strength strength-medium";
      }
    }

    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    function signup() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirmPassword").value.trim();
      const email = document.getElementById("email").value.trim();
      const agreeTerms = document.getElementById("agreeTerms").checked;
      const profileImage = document.getElementById("profileImage").files[0];

      if (!username || !password || !confirmPassword || !email) {
        alert("모든 입력칸을 채워주세요.");
        return;
      }

      if (!isIdChecked) {
        alert("아이디 중복 확인을 해주세요.");
        return;
      }

      if (username.length < 6) {
        alert("아이디는 최소 6자 이상이어야 합니다.");
        return;
      }

      if (password.length < 8) {
        alert("비밀번호는 최소 8자 이상이어야 합니다.");
        return;
      }

      if (password !== confirmPassword) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      if (!validateEmail(email)) {
        alert("올바른 이메일 주소를 입력해주세요.");
        return;
      }

      if (!agreeTerms) {
        alert("약관에 동의해야 가입할 수 있습니다.");
        return;
      }

      if (!profileImage) {
        if (!confirm("프로필 이미지를 업로드하지 않고 가입하시겠습니까?")) {
          return;
        }
      }

      alert("회원가입이 완료되었습니다! 이메일 인증 페이지로 이동합니다.");
      window.location.href = "verify_email.html"; // 이메일 인증 페이지로 이동
    }
  </script>

</body>
</html>
